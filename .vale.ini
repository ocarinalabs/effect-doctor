StylesPath = .vale
MinAlertLevel = suggestion
Packages = AiTells, Harper, Readability, neighbor, alex, proselint, write-good, https://github.com/ammil-industries/vale-signs-of-ai-writing/releases/latest/download/signs-of-ai-writing.zip, https://github.com/JMill/deslop/releases/latest/download/Deslop.zip, https://github.com/ChrisChinchilla/Openly/releases/download/0.4.6/Openly.zip
Vocab = EffectDoctor

[*.{md,mdx,txt}]
BasedOnStyles = Vale, AiTells, Harper, Readability, neighbor, alex, proselint, write-good, signs-of-ai-writing, Deslop, Openly
# Readability already supplies the same whole-document metric.
Openly.Readability = NO
# Product and package names intentionally use title casing.
Openly.Titles = NO
TokenIgnores = (?:(?:eslint|oxlint)-plugin-effect-doctor)
write-good.E-Prime = NO

# Whole-document grade metrics do not apply to glossaries, API references,
# rule tables, or pull-request forms. All other rules still run in these files.
[CONTEXT.md]
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

[packages/*/README.md]
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

[action/README.md]
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

[.github/*.md]
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
