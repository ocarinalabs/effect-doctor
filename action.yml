name: Effect Doctor
description: Analyze Effect v4 projects and report new or existing Findings
branding:
  icon: activity
  color: purple

inputs:
  directory:
    description: Project directory to analyze
    default: .
  project:
    description: TypeScript project file relative to directory
    default: tsconfig.json
  scope:
    description: "Pull request scope: changed, files, lines, or full. Other events always use full."
    default: changed
  comment:
    description: Create or update a pull request summary comment
    default: "true"
  review-comments:
    description: Add review comments for Findings on changed lines
    default: "true"
  commit-status:
    description: Publish an Effect Doctor commit status
    default: "true"
  node-version:
    description: Node.js version for the Action
    default: "24"
  version:
    description: Effect Doctor npm version or package specification
    default: "0.1.0"

outputs:
  completed:
    description: Whether every Analyzer Run completed
    value: ${{ steps.scan.outputs.completed }}
  total-findings:
    description: Findings selected by the requested scope
    value: ${{ steps.scan.outputs.total-findings }}
  resolved-findings:
    description: Findings resolved by a pull request comparison
    value: ${{ steps.scan.outputs.resolved-findings }}
  error-count:
    description: Error Findings selected by the requested scope
    value: ${{ steps.scan.outputs.error-count }}
  warning-count:
    description: Warning Findings selected by the requested scope
    value: ${{ steps.scan.outputs.warning-count }}
  affected-files:
    description: Files containing selected Findings
    value: ${{ steps.scan.outputs.affected-files }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Analyze project
      id: scan
      shell: bash
      env:
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_REVIEW_COMMENTS: ${{ inputs.review-comments }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_VERSION: ${{ inputs.version }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"

    - name: Publish GitHub report
      if: ${{ always() && steps.scan.outputs.result-file != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMPOSITE_ACTION_PATH: ${{ github.action_path }}
        EFFECT_DOCTOR_COMMENT: ${{ inputs.comment }}
        EFFECT_DOCTOR_COMMIT_STATUS: ${{ inputs.commit-status }}
        EFFECT_DOCTOR_RESULT: ${{ steps.scan.outputs.result-file }}
        EFFECT_DOCTOR_REVIEW_COMMENTS: ${{ inputs.review-comments }}
      with:
        github-token: ${{ github.token }}
        script: |
          const { pathToFileURL } = require("node:url");
          const moduleUrl = pathToFileURL(
            `${process.env.COMPOSITE_ACTION_PATH}/action/github.mjs`,
          ).href;
          const { publish } = await import(moduleUrl);
          await publish({
            comment: process.env.EFFECT_DOCTOR_COMMENT,
            commitStatus: process.env.EFFECT_DOCTOR_COMMIT_STATUS,
            core,
            context,
            github,
            resultPath: process.env.EFFECT_DOCTOR_RESULT,
            reviewComments: process.env.EFFECT_DOCTOR_REVIEW_COMMENTS,
          });

    - name: Fail on Findings
      if: ${{ always() }}
      shell: bash
      env:
        EFFECT_DOCTOR_RESULT: ${{ steps.scan.outputs.result-file }}
      run: node "$GITHUB_ACTION_PATH/action/enforce.mjs" "$EFFECT_DOCTOR_RESULT"
