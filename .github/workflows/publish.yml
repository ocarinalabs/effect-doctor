name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf-8"));
          const expected = `v${manifest.version}`;
          if (
            process.env.RELEASE_TAG !== expected ||
            manifest.name !== "@ocarinalabs/effect-doctor" ||
            manifest.private === true
          ) {
            throw new Error(`Release metadata does not match ${expected}`);
          }
          NODE
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git show-ref --verify refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - run: bun install --frozen-lockfile
      - run: bun run setup:effect
      - run: bun run audit:dependencies
      - run: bun run check
      - run: bun run audit
      - run: bun run doctor:self
      - run: node scripts/verify-package.mjs --release-directory "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: >-
      github.event.release.prerelease == false && vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    needs: verify
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release
      - run: sha256sum --check SHA256SUMS
        working-directory: release
      - run: npm publish package.tgz --access public
        working-directory: release
